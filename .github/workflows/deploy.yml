name: Deploy to GitHub Pages

# The hook: every push to main rebuilds and republishes the site.
# Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the job push the built site to the gh-pages branch.
permissions:
  contents: write

# A newer push supersedes one already running.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build and publish
        run: bash scripts/deploy.sh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
